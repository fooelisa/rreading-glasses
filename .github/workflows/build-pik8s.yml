name: build-pik8s

on:
  push:
    branches:
      - pik8s
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Hardcover variant (matches upstream :hardcover tag semantics)
          build-args: |
            RGPATH=./cmd/rghc
          tags: |
            ghcr.io/fooelisa/rreading-glasses:pik8s
            ghcr.io/fooelisa/rreading-glasses:pik8s-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
